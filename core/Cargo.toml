[package]
name = "reproductor_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jgcastanedas/reproductor-open"
description = "Núcleo del reproductor: lee MKV/MP4, remuxea a HLS fMP4 sin recodificar y lo sirve por HTTP en la red local para AirPlay."

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
# Solo hace falta en el Mac para generar los bindings Swift.
required-features = ["cli"]

[[bin]]
name = "reproductor-cli"
path = "src/bin/cli.rs"

[dependencies]
uniffi = "0.32"
thiserror = "2"
tiny_http = "0.12"
if-addrs = "0.13"

[features]
# Herramienta de generación de bindings (clap, askama, goblin…): fuera de la librería de la app.
cli = ["uniffi/cli"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Xcode hace el strip al empaquetar la app (rust-objcopy falla en algunos toolchains).
strip = "none"
